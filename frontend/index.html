<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minecraft AFK Bot</title>
<style>
  :root {
    --bg: #1b1f1a;
    --panel: #24291f;
    --panel2: #1f2418;
    --accent: #7ec850;
    --accent-dark: #5a9c34;
    --text: #eef1e8;
    --muted: #9aa590;
    --danger: #d9534f;
    --warn: #e0b93a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; text-align: center; }
  p.subtitle { text-align: center; color: var(--muted); margin: 0 0 8px; font-size: 13px; }
  p.capacity { text-align: center; color: var(--muted); margin: 0 0 24px; font-size: 12px; }

  .layout {
    max-width: 1000px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--panel);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .card h2 { font-size: 15px; margin: 0 0 16px; color: var(--accent); }

  label { display: block; font-size: 13px; margin: 12px 0 6px; color: var(--muted); }
  label.required { color: var(--danger); font-weight: 600; }
  input[type=text], input[type=number], select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #3a4130;
    background: #171b13;
    color: var(--text);
    font-size: 14px;
  }
  select#version { border-color: #5a3030; }

  .nick-row { display: flex; gap: 8px; }
  .nick-row input { flex: 1; }
  .nick-row button.ghost { flex: 0 0 auto; width: 44px; padding: 10px 0; font-size: 16px; }

  .toggle-group { display: flex; gap: 8px; margin-top: 6px; }
  .toggle-group button {
    flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #3a4130;
    background: #171b13; color: var(--muted); cursor: pointer; font-size: 13px;
  }
  .toggle-group button.active { background: var(--accent-dark); color: #fff; border-color: var(--accent-dark); }

  .actions { display: flex; gap: 10px; margin-top: 20px; }
  button.primary, button.stop, button.ghost {
    flex: 1; padding: 12px; border-radius: 8px; border: none;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.primary { background: var(--accent); color: #10230a; }
  button.primary:hover { background: var(--accent-dark); color: #fff; }
  button.stop { background: var(--danger); color: #fff; }
  button.stop:hover { background: #b8433f; }
  button.ghost { background: #171b13; color: var(--muted); border: 1px solid #3a4130; }
  button.ghost:hover { color: var(--text); }

  .footnote { margin-top: 16px; font-size: 11px; color: var(--muted); text-align: center; }

  /* Bot list */
  .bot-item {
    background: var(--panel2);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid #333c28;
  }
  .bot-item-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bot-item-title { font-weight: 600; font-size: 14px; }
  .bot-item-info { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
  .bot-item-info .err { color: var(--danger); }
  .bot-item-btns { display: flex; gap: 6px; margin-top: 10px; }
  .bot-item-btns button {
    padding: 6px 10px; font-size: 12px; border-radius: 6px; border: 1px solid #3a4130;
    background: #171b13; color: var(--muted); cursor: pointer;
  }
  .bot-item-btns button:hover { color: var(--text); }
  .bot-item-btns button.danger:hover { color: var(--danger); border-color: var(--danger); }

  .empty-state { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 10px; }

  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .dot.online { background: var(--accent); }
  .dot.offline { background: #666; }
  .dot.error { background: var(--danger); }
  .dot.connecting, .dot.reconnecting { background: var(--warn); }

  .msa-box {
    margin-top: 10px; padding: 10px; border-radius: 8px;
    background: #2a2412; border: 1px solid #6b5a1c; font-size: 12px;
  }
  a { color: var(--accent); }

  /* Toast notifications */
  #toastContainer {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 320px;
  }
  .toast {
    background: #3a1f1c;
    border: 1px solid var(--danger);
    color: #ffe4e2;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    animation: slideIn 0.25s ease-out;
  }
  .toast.info {
    background: #23301c;
    border-color: var(--accent-dark);
    color: #eaffe0;
  }
  @keyframes slideIn {
    from { transform: translateX(40px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
</style>
</head>
<body>

<div id="toastContainer"></div>

<h1>⛏️ Minecraft AFK Bot</h1>
<p class="subtitle">Serveringizga bot yuboring, u doim online turadi</p>
<p class="capacity" id="capacityText">Serverda band: yuklanmoqda...</p>

<div class="layout">

  <!-- LEFT: form -->
  <div class="card">
    <h2 id="formTitle">Yangi bot qo'shish</h2>

    <label>Server IP / manzil</label>
    <input type="text" id="host" placeholder="masalan: play.example.net" />

    <label>Port (ixtiyoriy, default 25565)</label>
    <input type="number" id="port" placeholder="25565" />

    <label>Bot nickname</label>
    <div class="nick-row">
      <input type="text" id="username" placeholder="AFKBot123" />
      <button type="button" class="ghost" title="Tasodifiy nik" onclick="generateRandomNick()">🎲</button>
    </div>

    <label>Server turi</label>
    <div class="toggle-group">
      <button type="button" id="btnCracked" class="active" onclick="setAuth('cracked')">Cracked</button>
      <button type="button" id="btnPremium" onclick="setAuth('premium')">Premium (litsenziyali)</button>
    </div>

    <label class="required">Minecraft versiyasi * (majburiy)</label>
    <select id="version">
      <option value="">— Versiyani tanlang —</option>
      <!-- To'ldiriladi: JS orqali backend /api/versions'dan (pastga qarang) -->
    </select>

    <label>Qancha vaqt ulanib tursin? (daqiqa, bo'sh = cheksiz)</label>
    <input type="number" id="duration" placeholder="masalan: 120" />

    <div class="actions">
      <button class="primary" id="startBtn" onclick="handleStart()">▶ Start</button>
      <button class="ghost" id="cancelEditBtn" onclick="cancelEdit()" style="display:none;">Bekor qilish</button>
    </div>

    <div class="footnote">
      Backend manzili: <code id="apiBaseDisplay"></code>
    </div>
  </div>

  <!-- RIGHT: bot list -->
  <div class="card">
    <h2>Sizning botlaringiz</h2>
    <div id="botList"></div>
  </div>

</div>

<script>
  // ⚠️ IMPORTANT: change this to your own backend URL (Northflank public URL)
  const API_BASE = "https://p01--mcfree--z9mrk5ztwk2d.code.run";
  document.getElementById("apiBaseDisplay").textContent = API_BASE;

  const STORAGE_KEY = "mcAfkBots";
  let authMode = "cracked";
  let editingId = null; // sessionId currently being edited, or null = new bot

  // ---------------------------------------------------------------
  // 34 ta o'zbekcha xato xabari — backenddan kelgan `code` shu ro'yxatga
  // mos keladi. Backend har doim { code, message, raw } shaklida
  // lastError yuboradi, shuning uchun bu jadval asosan frontend-only
  // (masalan tarmoq darajasidagi xatolar) holatlar uchun zaxira sifatida.
  // ---------------------------------------------------------------
  const UZBEK_ERRORS = {
    host_required: "Server IP/manzili noto'g'ri yoki bo'sh!",
    invalid_port: "Port raqami noto'g'ri (1-65535 oralig'ida bo'lishi kerak)",
    invalid_username: "Foydalanuvchi nomi 3-16 belgidan iborat bo'lishi kerak",
    version_required: "Minecraft versiyasini tanlab olish majburiy!",
    unsupported_version: "Bu versiya taqdim qilinmagan yoki qo'llanmaydi",
    connection_refused: "Server ulanishni rad etdi",
    timeout: "Ulanish vaqti tugadi",
    network_error: "Tarmoq xatosi",
    auth_failed: "Foydalanuvchi nomi yoki parol noto'g'ri (Premium)",
    server_full: "Server to'lgan",
    kicked: "Server sizni chiqarib tashladi",
    client_outdated: "Client versiyasi eski",
    server_outdated: "Server eski versiyasida",
    authentication_failed: "Autentifikatsiya muvaffaqiyatsiz",
    msa_required: "Microsoft hisob tasdiqlanishi kerak",
    access_denied: "Kirish ruxsati berilmagan",
    not_whitelisted: "Siz server whitelist'ida emassiz",
    banned: "Siz bu serverdan bloklangansiz",
    too_many_requests: "Juda ko'p urinish",
    invalid_session: "Sessiyangiz yaroqsiz",
    protocol_error: "Protokol xatosi",
    compression_error: "Siqish xatosi",
    encryption_error: "Shifrlash xatosi",
    io_error: "Kirish/Chiqish xatosi",
    server_crashed: "Server quladi",
    no_response: "Server javob bermadi",
    dns_error: "Server manzilini topib bo'lmadi",
    firewall_blocked: "Fayervol tomonidan bloklandi",
    malformed_data: "Server noto'g'ri ma'lumot yubordi",
    server_not_exist: "Server mavjud emas",
    connection_lost: "Ulanish yo'qoldi",
    backend_error: "Backend xatosi",
    capacity_exceeded: "Server sig'imi oshib ketdi",
    unknown_error: "Noma'lum xatolik yuz berdi",
  };

  function translateError(errObj) {
    if (!errObj) return null;
    if (typeof errObj === "string") return errObj;
    if (errObj.message) return errObj.message;
    if (errObj.code && UZBEK_ERRORS[errObj.code]) return UZBEK_ERRORS[errObj.code];
    return UZBEK_ERRORS.unknown_error;
  }

  // ---- Toast notifications ----
  function showError(text) {
    showToast(text, "error");
  }
  function showToast(text, kind) {
    const container = document.getElementById("toastContainer");
    const el = document.createElement("div");
    el.className = "toast" + (kind === "info" ? " info" : "");
    el.textContent = (kind === "info" ? "" : "❌ ") + text;
    container.appendChild(el);
    setTimeout(() => el.remove(), 6000);
  }

  // ---- 45 ta tasodifiy gaming nik ----
  const RANDOM_NICKS = [
    // Dragons & Magic
    "DragonSlayer", "CreeperKing", "EnderMaster", "NetherKing", "SkyWalker",
    "PixelPro", "BlockHunter", "MineGod", "SteveMaster",
    // Mining
    "DirtDigger", "IronFinder", "GoldRusher", "LavaWalker", "FrostByte",
    // Combat
    "ShadowNinja", "PhantomRider", "SkeletonSlayer", "ZombieKiller", "SpiderHunter",
    "PumpkinKing", "WitchHunter", "BattleCry", "PvPLord",
    // Magic & Redstone
    "RedstoneGod", "CommandMaster", "ModBuilder",
    // Builders
    "BuilderPro", "MapArtist", "HuskarBrave", "RiddleStone",
    // Explorers
    "CaveExplorer", "CubeMaster", "AdventureSeeker", "TreasureHunter", "TempleRaider",
    // Animals & Nature
    "FoxFriend", "ArmadilloRider", "BeeKeeper", "VillagerDealer", "FarmMaster",
    // PvP & Gaming
    "ParkourKing", "SurvivalPro", "NoobSlayer", "LagFighter",
  ];
  function generateRandomNick() {
    const base = RANDOM_NICKS[Math.floor(Math.random() * RANDOM_NICKS.length)];
    const num = Math.floor(Math.random() * 1000); // 0-999
    document.getElementById("username").value = base + num;
  }

  // ---- Minecraft versions: every real 1.12.2 -> 26.2 release. ----
  // Loaded from the backend (/api/versions) so the dropdown always matches
  // what the server actually validates against. Falls back to this local
  // copy if the backend is unreachable when the page loads.
  const FALLBACK_VERSIONS = [
    "1.12.2", "1.13", "1.13.1", "1.13.2",
    "1.14", "1.14.1", "1.14.2", "1.14.3", "1.14.4",
    "1.15", "1.15.1", "1.15.2",
    "1.16", "1.16.1", "1.16.2", "1.16.3", "1.16.4", "1.16.5",
    "1.17", "1.17.1",
    "1.18", "1.18.1", "1.18.2",
    "1.19", "1.19.1", "1.19.2", "1.19.3", "1.19.4",
    "1.20", "1.20.1", "1.20.2", "1.20.3", "1.20.4", "1.20.5", "1.20.6",
    "1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11",
    "26.1", "26.1.1", "26.1.2", "26.2",
  ];

  function populateVersionSelect(versions) {
    const select = document.getElementById("version");
    const current = select.value;
    select.innerHTML = '<option value="">— Versiyani tanlang —</option>' +
      versions.map(v => `<option value="${v}">${v}</option>`).join("");
    if (current && versions.includes(current)) select.value = current;
  }

  async function loadVersions() {
    try {
      const res = await fetch(`${API_BASE}/api/versions`);
      const data = await res.json();
      populateVersionSelect(data.versions && data.versions.length ? data.versions : FALLBACK_VERSIONS);
    } catch (e) {
      populateVersionSelect(FALLBACK_VERSIONS);
    }
  }

  function loadBots() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveBots(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function setAuth(mode) {
    authMode = mode;
    document.getElementById("btnCracked").classList.toggle("active", mode === "cracked");
    document.getElementById("btnPremium").classList.toggle("active", mode === "premium");
  }

  function readForm() {
    return {
      host: document.getElementById("host").value.trim(),
      port: document.getElementById("port").value.trim(),
      username: document.getElementById("username").value.trim(),
      version: document.getElementById("version").value,
      duration: document.getElementById("duration").value.trim(),
      authMode,
    };
  }

  function fillForm(entry) {
    document.getElementById("host").value = entry.host || "";
    document.getElementById("port").value = entry.port || "";
    document.getElementById("username").value = entry.username || "";
    document.getElementById("version").value = entry.version || "";
    document.getElementById("duration").value = entry.duration || "";
    setAuth(entry.authMode || "cracked");
  }

  function clearForm() {
    document.getElementById("host").value = "";
    document.getElementById("port").value = "";
    document.getElementById("username").value = "";
    document.getElementById("version").value = "";
    document.getElementById("duration").value = "";
    setAuth("cracked");
  }

  // ---- Frontend-side validation (mirrors backend rules) ----
  function validateForm(form) {
    if (!form.host) return UZBEK_ERRORS.host_required;
    if (form.port) {
      const p = Number(form.port);
      if (!Number.isInteger(p) || p < 1 || p > 65535) return UZBEK_ERRORS.invalid_port;
    }
    if (!form.username || form.username.length < 3 || form.username.length > 16) {
      return UZBEK_ERRORS.invalid_username;
    }
    if (!form.version) return UZBEK_ERRORS.version_required;
    return null;
  }

  async function callStart(entry) {
    const res = await fetch(`${API_BASE}/api/bot/start`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        sessionId: entry.id,
        host: entry.host,
        port: entry.port ? Number(entry.port) : undefined,
        username: entry.username,
        authMode: entry.authMode,
        version: entry.version || undefined,
        durationMinutes: entry.duration ? Number(entry.duration) : undefined,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      const err = new Error(translateError(data.error) || "Backend xatosi");
      err.payload = data;
      throw err;
    }
    return data;
  }

  async function handleStart() {
    const form = readForm();
    const validationError = validateForm(form);
    if (validationError) {
      showError(validationError);
      return;
    }

    const id = editingId || crypto.randomUUID();
    const entry = { id, ...form };

    let list = loadBots();
    const idx = list.findIndex(b => b.id === id);
    if (idx >= 0) list[idx] = entry; else list.push(entry);
    saveBots(list);

    try {
      await callStart(entry);
      showToast(`Bot ishga tushirildi: ${entry.username}`, "info");
    } catch (e) {
      showError(e.message || "Backend'ga ulanib bo'lmadi. API_BASE manzilini tekshiring.");
    }

    cancelEdit();
    renderList();
  }

  async function stopBotEntry(id) {
    try {
      await fetch(`${API_BASE}/api/bot/stop`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId: id }),
      });
    } catch (e) { /* ignore */ }
    renderList();
  }

  async function reconnectEntry(id) {
    const list = loadBots();
    const entry = list.find(b => b.id === id);
    if (!entry) return;
    try {
      await callStart(entry);
    } catch (e) {
      showError(e.message || "Backend'ga ulanib bo'lmadi.");
    }
    renderList();
  }

  function editEntry(id) {
    const list = loadBots();
    const entry = list.find(b => b.id === id);
    if (!entry) return;
    editingId = id;
    fillForm(entry);
    document.getElementById("formTitle").textContent = "Botni tahrirlash";
    document.getElementById("cancelEditBtn").style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function cancelEdit() {
    editingId = null;
    clearForm();
    document.getElementById("formTitle").textContent = "Yangi bot qo'shish";
    document.getElementById("cancelEditBtn").style.display = "none";
  }

  function removeEntry(id) {
    stopBotEntry(id);
    let list = loadBots().filter(b => b.id !== id);
    saveBots(list);
    renderList();
  }

  function statusLabel(s) {
    const map = {
      online: "Online",
      offline: "Offline",
      connecting: "Ulanmoqda...",
      reconnecting: "Qayta ulanmoqda...",
      error: "Xato",
    };
    return map[s] || s;
  }

  async function fetchStatus(id) {
    try {
      const res = await fetch(`${API_BASE}/api/bot/status?sessionId=${id}`);
      return await res.json();
    } catch (e) {
      return { status: "offline" };
    }
  }

  async function renderList() {
    const list = loadBots();
    const container = document.getElementById("botList");

    if (list.length === 0) {
      container.innerHTML = `<div class="empty-state">Hali bot qo'shmagansiz.<br>Chapdagi forma orqali birinchi botingizni qo'shing.</div>`;
      return;
    }

    const statuses = await Promise.all(list.map(b => fetchStatus(b.id)));

    container.innerHTML = list.map((entry, i) => {
      const s = statuses[i];
      const dotClass = s.status || "offline";
      let msa = "";
      if (s.msaLogin) {
        msa = `<div class="msa-box">Microsoft hisobga kirish kerak:<br>
          <a href="${s.msaLogin.url}" target="_blank">${s.msaLogin.url}</a><br>
          Kod: <b>${s.msaLogin.code}</b></div>`;
      }
      const errText = translateError(s.lastError);
      return `
        <div class="bot-item">
          <div class="bot-item-head">
            <div class="bot-item-title">${entry.username || "AFKBot"}</div>
            <div><span class="dot ${dotClass}"></span>${statusLabel(s.status)}</div>
          </div>
          <div class="bot-item-info">
            Server: ${entry.host}${entry.port ? ":" + entry.port : ""}<br>
            Turi: ${entry.authMode === "premium" ? "Premium" : "Cracked"}${entry.version ? " · v" + entry.version : ""}
            ${errText ? `<br><span class="err">Xato: ${errText}</span>` : ""}
          </div>
          ${msa}
          <div class="bot-item-btns">
            <button onclick="reconnectEntry('${entry.id}')">↻ Qayta ulash</button>
            <button onclick="stopBotEntry('${entry.id}')">■ To'xtatish</button>
            <button onclick="editEntry('${entry.id}')">✎</button>
            <button class="danger" onclick="removeEntry('${entry.id}')">🗑 O'chirish</button>
          </div>
        </div>`;
    }).join("");
  }

  async function refreshCapacity() {
    try {
      const res = await fetch(`${API_BASE}/api/bot/count`);
      const data = await res.json();
      document.getElementById("capacityText").textContent = `Serverda band: ${data.active} / ${data.max} bot`;
    } catch (e) {
      document.getElementById("capacityText").textContent = "Serverda band: noma'lum";
    }
  }

  loadVersions();
  renderList();
  refreshCapacity();
  setInterval(renderList, 5000);
  setInterval(refreshCapacity, 10000);
</script>

</body>
</html>
